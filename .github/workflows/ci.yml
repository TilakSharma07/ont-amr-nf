name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stub-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nxf_ver: ["24.04.0", "latest-stable"]
    env:
      NXF_VER: ${{ matrix.nxf_ver }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          {
            echo "## ${{ matrix.nxf_ver }} — installed version"
            echo '```'
            nextflow -version 2>&1 || echo "nextflow -version itself failed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stub run - validates the whole DAG, no data or tools
        run: |
          set +e
          nextflow run . -stub-run --outdir results_stub > nxf_out.txt 2>&1
          code=$?
          {
            echo "## ${{ matrix.nxf_ver }} — stub run (exit $code)"
            echo '```'
            tail -60 nxf_out.txt
            echo '```'
            if [ -f .nextflow.log ]; then
              echo '<details><summary>.nextflow.log tail</summary>'
              echo ''
              echo '```'
              tail -50 .nextflow.log
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: The negative control must still be in the DAG
        run: |
          test -d results_stub
          grep -rqi "decoy" results_stub || { echo "::error::decoy absent"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.nxf_ver }}
          path: |
            nxf_out.txt
            .nextflow.log
            results_stub/pipeline_info/
          if-no-files-found: ignore
